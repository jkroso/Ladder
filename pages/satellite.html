<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One satellite of the fleet</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden }
  canvas { display: block }
  #about { position: absolute; left: 12px; bottom: 10px; font: 12px/16px -apple-system, Helvetica, sans-serif; color: #d8dde6 }
  #about b { color: #fff; font-weight: 600 }
</style>
</head>
<body>
<div id="about"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
} }
</script>
<script type="module">
// One satellite of the fleet on the page "Data centres in space". Its sizes are the page's sums, which Ladder
// gives this page as `ladder.sums`, in SI units. Outside Ladder it shows the page's first numbers.
import * as THREE from 'three';

// ------------------------------------------------------------------ the sizes
const FIRST = { span: 70, array_area: 3406586, nsat: 6667, rad_use: 14, loop_d: 0.03, loop_out: 0.3, sat_kg: 2180, lens: 0.02, alt: 1e6, sat: 150000 };
const sums = () => Object.assign({}, FIRST, (window.ladder && ladder.sums) || {});
const shown = (name, or) => (window.ladder && ladder.shown && ladder.shown[name]) || or;

const R_EARTH = 6.378e6;
// In a dawn–dusk orbit the Sun is off to one side, and up to about 25° above level. The orbit runs along the line between day and night.
const SUN = new THREE.Vector3(0, 0.42, 1).normalize();

// ------------------------------------------------------------------ the renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// The Earth is a million metres away and the satellite a few, so each is drawn with a camera of its own depth
const scene = new THREE.Scene();
const earthScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 2000);
const earthCamera = new THREE.PerspectiveCamera(40, 1, 1e4, 4e7);

// ------------------------------------------------------------------ textures, made here so the page needs no files
const data = (w, h, f, srgb = true) => {
  const a = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = f(x, y), i = 4 * (y * w + x);
    a[i] = c[0]; a[i + 1] = c[1]; a[i + 2] = c[2]; a[i + 3] = 255;
  }
  const t = new THREE.DataTexture(a, w, h, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
};
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s) };
const smooth = (x, y, n) => {   // value noise that tiles every n cells
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const h = (i, j) => hash(((i % n) + n) % n, ((j % n) + n) % n);
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v;
};

// A tile of 4 by 4 printed cells: dark blue, with thin silver lines between them and fine fingers across each
const CELL = 0.125;   // m, one cell
const cellTile = data(256, 256, (x, y) => {
  const cx = x % 64, cy = y % 64;
  if (cx < 2 || cy < 2) return [150, 155, 165];
  if (cy % 8 === 0) return [62, 70, 92];
  const n = 12 * hash(x, y);
  return [14 + n, 22 + n, 48 + n];
});
const cellRough = data(256, 256, (x, y) => { const g = (x % 64 < 2 || y % 64 < 2) ? 110 : 105 + 35 * hash(x + 7, y); return [g, g, g] }, false);

// Gold foil: crumpled, so it catches the light in patches
const crumple = (x, y) => 0.6 * smooth(x / 16, y / 16, 16) + 0.3 * smooth(x / 6, y / 6, 43) + 0.1 * smooth(x / 2, y / 2, 128);
const foilNormal = data(256, 256, (x, y) => {
  const dx = crumple(x + 1, y) - crumple(x - 1, y), dy = crumple(x, y + 1) - crumple(x, y - 1);
  const k = 6, nx = -dx * k, ny = -dy * k, l = Math.hypot(nx, ny, 1);
  return [128 + 127 * nx / l, 128 + 127 * ny / l, 128 + 127 / l];
}, false);

// The radiator's white paint, with the tubes under it every 10 cm
const tubes = data(64, 64, (x, y) => { const t = Math.abs((y % 64) - 32) < 3; return t ? [128, 150, 230] : [128, 128, 255] }, false);

// ------------------------------------------------------------------ materials
const gold = new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 1, roughness: 0.32, normalMap: foilNormal, normalScale: new THREE.Vector2(0.9, 0.9) });
const silverFoil = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, metalness: 1, roughness: 0.3, normalMap: foilNormal, normalScale: new THREE.Vector2(0.6, 0.6) });
const cells = new THREE.MeshPhysicalMaterial({ map: cellTile, roughnessMap: cellRough, color: 0xffffff, metalness: 0.15, roughness: 1,
  clearcoat: 0.35, clearcoatRoughness: 0.12, envMapIntensity: 0.4, side: THREE.FrontSide });
const fabricBack = new THREE.MeshStandardMaterial({ color: 0xb58a3a, metalness: 0.1, roughness: 0.55, side: THREE.FrontSide });   // the back of the fabric: amber film
const whitePaint = new THREE.MeshStandardMaterial({ color: 0xf2f2ee, roughness: 0.55, metalness: 0, normalMap: tubes, normalScale: new THREE.Vector2(0.4, 0.4) });
const pipeMetal = new THREE.MeshStandardMaterial({ color: 0xdfe3e8, metalness: 0.9, roughness: 0.22 });
const darkMetal = new THREE.MeshStandardMaterial({ color: 0x2b2e33, metalness: 0.7, roughness: 0.4 });
const blackAnodised = new THREE.MeshStandardMaterial({ color: 0x0c0c0e, metalness: 0.2, roughness: 0.6 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x0a1422, metalness: 0, roughness: 0.02, clearcoat: 1, clearcoatRoughness: 0 });
const ceramic = new THREE.MeshStandardMaterial({ color: 0xe9e4da, roughness: 0.7 });
const loopLine = new THREE.LineBasicMaterial({ color: 0x9aa4b0 });

// ------------------------------------------------------------------ light
const sun = new THREE.DirectionalLight(0xfff6ec, 5.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
// The light that the Earth sends back, from below
const earthshine = new THREE.HemisphereLight(0x000000, 0x5d7fa8, 0.55);
scene.add(earthshine);

// Reflections: black space above, and the Earth below, lit on the side of the Sun
const sky = (() => {
  const w = 256, h = 128, a = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const lat = Math.PI * (0.5 - (y + 0.5) / h), lon = 2 * Math.PI * ((x + 0.5) / w) - Math.PI;
    const d = new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
    const i = 4 * (y * w + x);
    let r = 0, g = 0, b = 0;
    if (d.y < -0.5) {   // the Earth fills the sky to 30° under the level, at this height
      const day = THREE.MathUtils.smoothstep(d.z + 0.8 * SUN.y, -0.15, 0.35);
      const cloud = 0.5 + 0.5 * smooth(x / 8, y / 8, 32);
      r = day * (0.14 + 0.4 * cloud); g = day * (0.22 + 0.42 * cloud); b = day * (0.42 + 0.45 * cloud);
    } else if (d.y < -0.45) {   // the thin blue line of the air at the edge
      const day = THREE.MathUtils.smoothstep(d.z, -0.3, 0.3);
      r = 0.1 * day; g = 0.25 * day; b = 0.6 * day;
    }
    if (d.dot(SUN) > 0.9995) { r = g = b = 400 }   // the Sun itself, for the glints
    a[i] = r; a[i + 1] = g; a[i + 2] = b; a[i + 3] = 1;
  }
  const t = new THREE.DataTexture(a, w, h, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.magFilter = t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
})();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(sky).texture;
scene.environmentIntensity = 0.9;

// ------------------------------------------------------------------ the Earth
const earth = new THREE.Mesh(new THREE.SphereGeometry(R_EARTH, 192, 128), new THREE.ShaderMaterial({
  uniforms: { sun: { value: SUN } },
  vertexShader: `
    varying vec3 vNormal; varying vec3 vWorld; varying vec3 vLocal;
    void main() {
      vLocal = position / ${R_EARTH.toFixed(1)};
      vec4 w = modelMatrix * vec4(position, 1.0);
      vWorld = w.xyz; vNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform vec3 sun;
    varying vec3 vNormal; varying vec3 vWorld; varying vec3 vLocal;
    float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float n3(vec3 x) {
      vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++) { s += a * n3(p); p *= 2.03; a *= 0.5; } return s; }
    void main() {
      vec3 n = normalize(vNormal);
      vec3 v = normalize(cameraPosition - vWorld);
      float light = dot(n, sun);
      float land = smoothstep(0.52, 0.56, fbm(vLocal * 2.2 + 3.0));
      float desert = smoothstep(0.5, 0.7, fbm(vLocal * 5.0 + 11.0));
      vec3 ground = mix(vec3(0.02, 0.06, 0.15), mix(vec3(0.07, 0.11, 0.04), vec3(0.32, 0.25, 0.14), desert), land);
      float c = fbm(vLocal * 6.0 + vec3(0.0, 4.0, 0.0)) * 0.7 + fbm(vLocal * 40.0) * 0.3;
      float cloud = smoothstep(0.42, 0.68, c);
      vec3 day = mix(ground, vec3(0.95), cloud) * max(light, 0.0) * 2.6;
      // The blue of the air over the day side
      day += vec3(0.04, 0.09, 0.22) * max(light, 0.0);
      // Sunlight that glints off the sea
      vec3 h = normalize(sun + v);
      day += (1.0 - land) * (1.0 - cloud) * pow(max(dot(n, h), 0.0), 120.0) * 3.0 * step(0.0, light);
      // The lights of towns, on the night side
      float towns = land * smoothstep(0.62, 0.8, fbm(vLocal * 90.0)) * (1.0 - cloud * 0.8);
      vec3 night = vec3(1.0, 0.62, 0.25) * towns * 0.25 * smoothstep(0.05, -0.15, light);
      // The air: blue at the edge, and red where the day ends
      float rim = pow(1.0 - max(dot(n, v), 0.0), 4.0);
      vec3 air = mix(vec3(0.25, 0.45, 1.0), vec3(1.0, 0.45, 0.2), smoothstep(0.2, 0.0, abs(light)) * 0.3) * rim * smoothstep(-0.25, 0.25, light) * 1.6;
      gl_FragColor = vec4(day + night + air, 1.0);
    }`
}));
earthScene.add(earth);
// The haze of the air round the edge of the Earth
const haze = new THREE.Mesh(new THREE.SphereGeometry(R_EARTH * 1.012, 128, 64), new THREE.ShaderMaterial({
  uniforms: { sun: { value: SUN } }, transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec3 vNormal; varying vec3 vWorld;
    void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; vNormal = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 sun; varying vec3 vNormal; varying vec3 vWorld;
    void main() {
      vec3 v = normalize(cameraPosition - vWorld);
      float edge = pow(1.0 - abs(dot(normalize(vNormal), v)), 6.0);
      float day = smoothstep(-0.3, 0.4, dot(normalize(vNormal), sun));
      gl_FragColor = vec4(vec3(0.3, 0.55, 1.0) * edge * day * 1.2, 1.0);
    }`
}));
earthScene.add(haze);

// ------------------------------------------------------------------ the satellite
const satellite = new THREE.Group();
// The satellite turns about the line of its orbit, so that its wings face the Sun and its radiator stays edge-on to it
satellite.rotation.x = -Math.asin(SUN.y);
scene.add(satellite);

// A loop of tube in a level plane at the height `y`, right round the satellite. It's an oval. It passes `wide` to each
// side of the middle, along x, and `deep` in front of the middle and behind it, along z.
const loop = (wide, deep, y, r) => {
  const points = [];
  for (let i = 0; i < 192; i++) {
    const a = 2 * Math.PI * i / 192;
    points.push(new THREE.Vector3(wide * Math.cos(a), y, deep * Math.sin(a)));
  }
  const curve = new THREE.CatmullRomCurve3(points, true);
  const pipe = new THREE.Mesh(new THREE.TubeGeometry(curve, 384, r, 8, true), pipeMetal);
  pipe.castShadow = pipe.receiveShadow = true;
  // A tube a few centimetres across is less than a pixel wide from afar, so a line of a pixel follows it
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(384)), loopLine);
  return new THREE.Group().add(pipe, line);
};
// A thin cord from `a` to `b`, drawn as a line of a pixel
const cord = (a, b) => new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]), loopLine);

// The texture of a shape repeats `x` times across it and `y` times up it
const scaled = (g, x, y) => { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * x, uv.getY(i) * y); return g };
const box = (w, h, d, m) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.castShadow = o.receiveShadow = true; return o };
const tube = (r, l, m, seg = 24) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, l, seg), m); o.castShadow = o.receiveShadow = true; return o };

// What the sums make: the wings of cells, the body, and the radiator
const build = () => {
  satellite.traverse(o => o.geometry && o.geometry.dispose());
  satellite.clear();
  const s = sums();
  const area = s.array_area / s.nsat;                    // m² of cells on one satellite
  const body = THREE.MathUtils.clamp(Math.cbrt(s.sat_kg / 450), 0.8, 4);   // m, a side of the body, at 450 kg a cubic metre
  const reach = Math.max(1, (s.span - body) / 2 - 0.6);    // m, how far each wing reaches past its drum
  const chord = area / (2 * reach);                        // m, how tall each wing is
  const loopR = s.loop_d / 2;                             // m
  const tipX = body / 2 + 0.6 + reach;                     // m from the middle to the tip of each wing
  const deep = Math.max(s.loop_out * tipX, body / 2 + 1.4); // m from the middle to the front of each loop, and to its back
  const radArea = s.array_area * s.rad_use / 100 / s.nsat; // m² of the radiator
  const radLong = deep - body / 2 - 0.4, radHigh = radArea / radLong;   // m: the radiator stands up behind the body, and reaches back to the loops

  // The body, wrapped in gold foil, with a silver deck on top
  const hull = box(body, body, body, gold);
  satellite.add(hull);
  const deck = box(body * 0.98, 0.03, body * 0.98, silverFoil);
  deck.position.y = body / 2 + 0.015;
  satellite.add(deck);

  for (const side of [-1, 1]) {
    // The drum that the wing unrolled from, on an arm from the side of the body
    const arm = box(0.5, 0.12, 0.12, darkMetal);
    arm.position.set(side * (body / 2 + 0.25), 0, 0);
    satellite.add(arm);
    const drum = tube(0.22, chord + 0.3, darkMetal);
    drum.position.set(side * (body / 2 + 0.6), 0, 0);
    satellite.add(drum);
    for (const end of [-1, 1]) {
      const cap = tube(0.26, 0.06, pipeMetal);
      cap.position.set(side * (body / 2 + 0.6), end * (chord / 2 + 0.15), 0);
      satellite.add(cap);
    }
    // The fabric of cells, held taut between the drum and the bar at its tip. The cells face the Sun, and amber film is behind them.
    const x0 = side * (body / 2 + 0.6) + side * reach / 2;
    const front = new THREE.Mesh(scaled(new THREE.PlaneGeometry(reach, chord), reach / (4 * CELL), chord / (4 * CELL)), cells);
    front.position.set(x0, 0, 0.002);
    front.castShadow = front.receiveShadow = true;
    satellite.add(front);
    const back = new THREE.Mesh(new THREE.PlaneGeometry(reach, chord), fabricBack);
    back.rotation.y = Math.PI;
    back.position.set(x0, 0, -0.002);
    back.receiveShadow = true;
    satellite.add(back);
    // The bar at the tip holds the end of the fabric. The loops pass through its two ends.
    const tip = tube(0.06, chord + 0.1, pipeMetal);
    tip.position.set(side * tipX, 0, 0);
    satellite.add(tip);
  }

  // Two loops of tube hold the wings and the radiator out, one level with each edge of the cells. Each goes right round
  // the satellite: through the tip of one wing, behind the body through the tip of the radiator, through the tip of the
  // other wing, and back in front of the body. The three tips can't move apart, so no wing can swing about its drum.
  // The pressure in a loop pushes it towards a circle. The radiator pulls its back in, and two cords from the drums pull
  // its front in. So it pushes the wings' tips apart, as a wheel's rim does on its spokes. The coolant from the chips
  // runs through it. With no radiator, cords hold the back too.
  const bare = radHigh < 0.05;
  for (const y of [-chord / 2, chord / 2]) {
    satellite.add(loop(tipX, deep, y, loopR));
    for (const z of bare ? [deep, -deep] : [deep]) for (const side of [-1, 1])
      satellite.add(cord([side * (body / 2 + 0.6), y, Math.sign(z) * 0.2], [side * 0.1, y, z]));
  }

  // The radiator stands up behind the body, edge-on to the Sun. It reaches back to the loops, which pass through the bar at its tip.
  const radRoot = -body / 2 - 0.4, radEnd = -deep;
  const arm = box(0.12, 0.12, 0.4, darkMetal);
  arm.position.set(0, 0, -body / 2 - 0.2);
  satellite.add(arm);
  const rad = box(0.02, radHigh, radLong, whitePaint);
  scaled(rad.geometry, radLong / 0.1, 1);
  rad.position.set(0, 0, (radRoot + radEnd) / 2);
  satellite.add(rad);
  // A bar at each end of the panel. The one at the tip is tall enough to reach both loops.
  for (const [z, high] of bare ? [] : [[radRoot, radHigh], [radEnd, Math.max(radHigh, chord)]]) {
    const bar = tube(0.04, high + 0.06, pipeMetal);
    bar.position.set(0, 0, z);
    satellite.add(bar);
  }

  // The laser to the next satellite, which looks along the orbit
  const mount = tube(0.09, 0.25, darkMetal);
  mount.position.set(body * 0.25, body / 2 + 0.15, body * 0.25);
  satellite.add(mount);
  const scope = tube(Math.max(0.05, s.lens * 2.5), 0.32, blackAnodised);
  scope.rotation.z = Math.PI / 2;
  scope.position.set(body * 0.25 + 0.05, body / 2 + 0.35, body * 0.25);
  satellite.add(scope);
  const lensFace = new THREE.Mesh(new THREE.CircleGeometry(Math.max(0.05, s.lens * 2.5) * 0.8, 32), glass);
  lensFace.rotation.y = Math.PI / 2;
  lensFace.position.set(body * 0.25 + 0.05 + 0.161, body / 2 + 0.35, body * 0.25);
  satellite.add(lensFace);

  // Two star trackers, looking away from the Sun and the Earth
  for (const k of [-1, 1]) {
    const t = tube(0.07, 0.22, blackAnodised);
    t.rotation.x = -0.5;
    t.position.set(k * body * 0.3, body / 2 + 0.12, -body * 0.3);
    satellite.add(t);
  }

  // The thruster: a ring of ceramic round a dark centre, for the last burn
  const thruster = tube(0.11, 0.12, darkMetal);
  thruster.position.set(-body * 0.25, body / 2 + 0.07, body * 0.2);
  satellite.add(thruster);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.018, 12, 32), ceramic);
  ring.rotation.x = Math.PI / 2;
  ring.position.set(-body * 0.25, body / 2 + 0.135, body * 0.2);
  satellite.add(ring);

  // The radio to the ground, on the face that looks at the Earth
  const patch = box(0.3, 0.02, 0.3, ceramic);
  patch.position.set(0, -body / 2 - 0.01, body * 0.2);
  satellite.add(patch);

  // The shadow covers the whole satellite
  const half = s.span / 2 + 2;
  Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half, near: 0.1, far: 2 * half + 40 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.position.copy(SUN).multiplyScalar(half + 20);

  // Under the satellite, the Earth at the page's height
  earth.position.set(0, -(R_EARTH + s.alt), 0);
  haze.position.copy(earth.position);

  document.getElementById('about').innerHTML =
    `<b>One satellite</b> of ${Math.round(s.nsat).toLocaleString('en')} · ${shown('sat', Math.round(s.sat / 1000) + 'kW')} of computers · ` +
    `wings ${shown('span', s.span + 'm')} across, ${Math.round(area)} m² of cells · radiator ${Math.round(radArea)} m² · ${Math.round(s.alt / 1000)} km up`;
  return { span: s.span };
};

// ------------------------------------------------------------------ the view: drag to turn it, the wheel or a pinch to come nearer,
// and a drag with the middle button to move it across
let turn = -0.55, tilt = 0.5, far = 1.0;
const target = new THREE.Vector3();   // the point that the view looks at, and turns round
let made = build();
const draw = () => {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = earthCamera.aspect = w / h;
  const d = far * made.span * 1.05;
  camera.position.set(d * Math.cos(tilt) * Math.sin(turn), d * Math.sin(tilt), d * Math.cos(tilt) * Math.cos(turn)).add(target);
  camera.lookAt(target);
  camera.near = Math.max(0.05, d / 400); camera.far = d * 20;
  camera.updateProjectionMatrix();
  earthCamera.position.copy(camera.position);
  earthCamera.quaternion.copy(camera.quaternion);
  earthCamera.updateProjectionMatrix();
  renderer.clear();
  renderer.render(earthScene, earthCamera);
  renderer.clearDepth();
  renderer.render(scene, camera);
};

let down = null, across = null;
addEventListener('mousedown', e => {
  if (e.button === 1) { across = [e.clientX, e.clientY]; e.preventDefault(); return }
  down = [e.clientX, e.clientY, turn, tilt];
});
addEventListener('mousemove', e => {
  if (across) {
    if (!(e.buttons & 4)) { across = null; return }
    // The satellite moves as far as the mouse does, at the distance of the point that the view looks at. That point
    // stays within a wing's span of the satellite's middle, so the satellite can't be lost.
    const metres = 2 * far * made.span * 1.05 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / innerHeight;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion), up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    target.addScaledVector(right, -(e.clientX - across[0]) * metres).addScaledVector(up, (e.clientY - across[1]) * metres).clampLength(0, made.span);
    across = [e.clientX, e.clientY];
    draw();
    return;
  }
  if (!down) return;
  turn = down[2] - (e.clientX - down[0]) * 0.008;
  tilt = THREE.MathUtils.clamp(down[3] + (e.clientY - down[1]) * 0.006, -1.2, 1.4);
  draw();
});
addEventListener('mouseup', e => { if (e.button === 1) across = null; else down = null });
// A pinch comes as the wheel with Ctrl held, where each 100 px is a factor of e, so it brings the satellite as near as the fingers spread
addEventListener('wheel', e => { far = THREE.MathUtils.clamp(far * Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), 0.04, 6); draw(); e.preventDefault() }, { passive: false });
addEventListener('resize', draw);
// Ladder tells the page when the sums change, as while a number is dragged
addEventListener('sums', () => { made = build(); draw() });
draw();
</script>
</body>
</html>
